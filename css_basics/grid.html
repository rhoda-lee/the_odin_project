<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .blue-div {
                background-color: lightblue;
            }
            .pink-div {
                background-color: lightpink;
            }
            .grid-container {
                margin-top: 30px;
                display: grid;
                grid-template-columns: 100px 100px 200px;
            }

            .grid-3 {
                margin-top: 30px;
                display: grid;
                grid-template-columns: 100px 1fr;
            }
        </style>
    </head>
    <body>
        <div class="grid-container">
            <div class="blue-div">Div 1</div>
            <div class="pink-div">
                Div 2
                <p>text</p>
            </div>
            <div class="blue-div">Div 3</div>
        </div>

        <div class="grid-container">
            <div class="blue-div">Div 1</div>
            <div class="pink-div">
                Div 2
                <p>text</p>
            </div>
            <div class="blue-div">Div 3</div>
            <div class="pink-div">Div 2</div>
        </div>

        <div class="grid-3">
            <div class="blue-div">Div 1</div>
            <div class="pink-div">
                Div 2
                <p>text</p>
            </div>
        </div>
    </body>
</html>
